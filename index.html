<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopMate</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
  scroll-behavior:smooth;
}

body{
  background:#0f0f0f;
  color:white;
  transition:0.4s;
}

.light-mode{
  background:#fafafa;
  color:#111;
}

/* NAVBAR */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 60px;
  position:sticky;
  top:0;
  backdrop-filter:blur(20px);
  background:rgba(0,0,0,0.5);
  z-index:100;
}

.logo{
  font-size:26px;
  font-weight:600;
  letter-spacing:1px;
  background:linear-gradient(45deg,#ff7eb3,#7afcff);
  -webkit-background-clip:text;
  color:transparent;
}

/* TOGGLE */
.toggle-container{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.toggle-btn{
  width:65px;
  height:32px;
  background:#333;
  border-radius:50px;
  position:relative;
  cursor:pointer;
  transition:0.3s;
}

.toggle-btn::before{
  content:"";
  position:absolute;
  width:28px;
  height:28px;
  background:white;
  border-radius:50%;
  top:2px;
  left:2px;
  transition:0.3s;
}

.light-mode .toggle-btn{
  background:#ddd;
}

.light-mode .toggle-btn::before{
  transform:translateX(33px);
}

.toggle-label{
  font-size:12px;
  margin-top:6px;
  opacity:0.7;
}

/* HERO */
.hero{
  height:90vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:url('https://source.unsplash.com/1600x900/?shopping,fashion,aesthetic') no-repeat center/cover;
}

.hero h1{
  font-size:65px;
  font-weight:600;
  background:linear-gradient(45deg,#fff,#bbb);
  -webkit-background-clip:text;
  color:transparent;
  animation:fadeUp 1.5s ease;
}

.hero p{
  margin-top:15px;
  font-size:18px;
  opacity:0.85;
}

/* SECTION */
.section{
  padding:80px 60px;
}

.section h2{
  font-size:30px;
  margin-bottom:40px;
}

/* GRID */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:30px;
}

/* CARD */
.card{
  border-radius:20px;
  overflow:hidden;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(12px);
  transition:0.4s;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.card:hover{
  transform:translateY(-10px) scale(1.04);
  box-shadow:0 20px 50px rgba(0,0,0,0.6);
}

.card img{
  width:100%;
  height:280px;
  object-fit:cover;
}

.card h3{
  padding:18px;
  font-size:18px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:50px;
}

.creator{
  font-size:20px;
  font-weight:bold;
  background:linear-gradient(45deg,#ff7eb3,#7afcff);
  -webkit-background-clip:text;
  color:transparent;
}

/* ANIMATION */
@keyframes fadeUp{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="logo">ShopMate</div>

  <div class="toggle-container">
    <div class="toggle-btn" onclick="toggleMode()"></div>
    <div class="toggle-label">Dark Mode</div>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div>
    <h1>Shop Smarter with ShopMate</h1>
    <p>Your AI-powered aesthetic shopping assistant</p>
  </div>
</section>

<!-- PRODUCTS -->
<section class="section">
  <h2>Trending Collections</h2>

  <div class="cards">

    <div class="card">
      <img src="https://source.unsplash.com/600x800/?sneakers,aesthetic" alt="">
      <h3>Sneaker Drops</h3>
    </div>

    <div class="card">
      <img src="https://source.unsplash.com/600x800/?gadgets,modern" alt="">
      <h3>Smart Gadgets</h3>
    </div>

    <div class="card">
      <img src="https://source.unsplash.com/600x800/?streetwear,fashion" alt="">
      <h3>Streetwear Fits</h3>
    </div>

    <div class="card">
      <img src="https://source.unsplash.com/600x800/?headphones,aesthetic" alt="">
      <h3>Accessories</h3>
    </div>

  </div>
</section>

<!-- FOOTER -->
<footer>
  <p class="creator">✨ Made by Prateek Singh ✨</p>
</footer>

<!-- DARK MODE -->
<script>
function toggleMode(){
  document.body.classList.toggle("light-mode");
}
</script>

<!-- IBM WATSON -->
<script>
  window.watsonAssistantChatOptions = {
    integrationID: "4d4af689-f086-4552-a48e-5fc360b893c0",
    region: "eu-de",
    serviceInstanceID: "25aa5c73-cbb5-42b3-8a2d-585abcb66967",
    onLoad: async (instance) => { await instance.render(); }
  };
  setTimeout(function(){
    const t=document.createElement('script');
    t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + 
    (window.watsonAssistantChatOptions.clientVersion || 'latest') + 
    "/WatsonAssistantChatEntry.js";
    document.head.appendChild(t);
  });
</script>

</body>
</html>
