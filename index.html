<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopMate Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
  scroll-behavior: smooth;
}

body {
  background: #0f0f0f;
  color: white;
  transition: 0.4s;
}

.light-mode {
  background: #f5f5f5;
  color: #111;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 50px;
  position: sticky;
  top: 0;
  backdrop-filter: blur(15px);
  background: rgba(0,0,0,0.4);
  z-index: 100;
}

.logo {
  font-size: 24px;
  font-weight: 600;
  background: linear-gradient(45deg,#ff7eb3,#7afcff);
  -webkit-background-clip: text;
  color: transparent;
}

/* TOGGLE BUTTON */
.toggle-container {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.toggle-btn {
  width: 60px;
  height: 30px;
  background: #333;
  border-radius: 50px;
  position: relative;
  cursor: pointer;
  transition: 0.3s;
}

.toggle-btn::before {
  content: "";
  position: absolute;
  width: 26px;
  height: 26px;
  background: white;
  border-radius: 50%;
  top: 2px;
  left: 2px;
  transition: 0.3s;
}

.light-mode .toggle-btn {
  background: #ddd;
}

.light-mode .toggle-btn::before {
  transform: translateX(30px);
}

.toggle-label {
  font-size: 12px;
  margin-top: 5px;
  opacity: 0.7;
}

/* HERO */
.hero {
  height: 90vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: url('https://images.unsplash.com/photo-1521335629791-ce4aec67dd53') center/cover;
}

.hero h1 {
  font-size: 60px;
  background: linear-gradient(45deg,#fff,#aaa);
  -webkit-background-clip: text;
  color: transparent;
  animation: fadeIn 2s ease;
}

.hero p {
  margin-top: 10px;
  font-size: 18px;
  opacity: 0.8;
}

/* SECTION */
.section {
  padding: 80px 50px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap: 30px;
}

/* CARD */
.card {
  border-radius: 20px;
  overflow: hidden;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.05);
  transition: 0.4s;
  cursor: pointer;
}

.card:hover {
  transform: translateY(-10px) scale(1.03);
}

.card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
}

.card h3 {
  padding: 15px;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 40px;
}

.creator {
  font-size: 18px;
  font-weight: bold;
  background: linear-gradient(45deg,#ff7eb3,#7afcff);
  -webkit-background-clip: text;
  color: transparent;
}

/* ANIMATION */
@keyframes fadeIn {
  from {opacity:0; transform:translateY(20px);}
  to {opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="logo">ShopMate</div>

  <div class="toggle-container">
    <div class="toggle-btn" onclick="toggleMode()"></div>
    <div class="toggle-label">Dark Mode</div>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div>
    <h1>Your Smart Shopping Assistant</h1>
    <p>Find trends, deals & styles instantly</p>
  </div>
</section>

<!-- PRODUCTS -->
<section class="section">
  <h2>Trending Picks</h2>

  <div class="cards">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
      <h3>Sneakers Collection</h3>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1526178613658-3f1622045557">
      <h3>Smart Gadgets</h3>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f">
      <h3>Fashion Wear</h3>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e">
      <h3>Accessories</h3>
    </div>

  </div>
</section>

<!-- FOOTER -->
<footer>
  <p class="creator">✨ Made by Prateek Singh ✨</p>
</footer>

<!-- DARK MODE SCRIPT -->
<script>
function toggleMode() {
  document.body.classList.toggle("light-mode");
}
</script>

<!-- IBM WATSON ASSISTANT -->
<script>
  window.watsonAssistantChatOptions = {
    integrationID: "4d4af689-f086-4552-a48e-5fc360b893c0",
    region: "eu-de",
    serviceInstanceID: "25aa5c73-cbb5-42b3-8a2d-585abcb66967",
    onLoad: async (instance) => { await instance.render(); }
  };
  setTimeout(function(){
    const t=document.createElement('script');
    t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + 
    (window.watsonAssistantChatOptions.clientVersion || 'latest') + 
    "/WatsonAssistantChatEntry.js";
    document.head.appendChild(t);
  });
</script>

</body>
</html>
