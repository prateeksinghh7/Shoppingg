<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopMate</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#0f0f0f;
  color:white;
  transition:0.4s;
}

.light-mode{
  background:#f5f5f5;
  color:#111;
}

/* NAVBAR */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 60px;
  backdrop-filter:blur(20px);
  background:rgba(0,0,0,0.5);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:26px;
  font-weight:600;
  background:linear-gradient(45deg,#ff7eb3,#7afcff);
  -webkit-background-clip:text;
  color:transparent;
}

/* SEARCH */
.search-box{
  display:flex;
  gap:10px;
}

.search-box input{
  padding:10px 15px;
  border-radius:20px;
  border:none;
  outline:none;
}

.search-box button{
  border:none;
  padding:10px 15px;
  border-radius:20px;
  cursor:pointer;
}

/* CART */
.cart{
  font-size:18px;
}

/* TOGGLE */
.toggle-container{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.toggle-btn{
  width:60px;
  height:30px;
  background:#333;
  border-radius:50px;
  position:relative;
  cursor:pointer;
}

.toggle-btn::before{
  content:"";
  position:absolute;
  width:26px;
  height:26px;
  background:white;
  border-radius:50%;
  top:2px;
  left:2px;
  transition:0.3s;
}

.light-mode .toggle-btn::before{
  transform:translateX(30px);
}

/* HERO */
.hero{
  height:80vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:url('https://images.pexels.com/photos/994523/pexels-photo-994523.jpeg') center/cover;
}

.hero h1{
  font-size:60px;
}

/* SECTION */
.section{
  padding:60px;
}

/* FILTER BUTTONS */
.filter-btn{
  padding:10px 20px;
  margin:5px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  background:linear-gradient(45deg,#ff7eb3,#7afcff);
  color:white;
  transition:0.3s;
}
.filter-btn:hover{
  transform:scale(1.1);
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:30px;
}

.card{
  border-radius:20px;
  overflow:hidden;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  transition:0.4s;
  box-shadow:0 0 10px rgba(255,255,255,0.1);
}

.card:hover{
  transform:translateY(-10px) scale(1.05);
  box-shadow:0 0 25px rgba(122,252,255,0.6);
}

.card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.card h3{
  padding:10px;
}

.card p{
  padding:0 10px;
}

.card button{
  margin:10px;
  padding:8px 15px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  background:linear-gradient(45deg,#ff7eb3,#7afcff);
  color:white;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  padding:15px 20px;
  border-radius:10px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:40px;
}

/* CHATBOT RESIZE */
#WACContainer iframe{
  width:320px !important;
  height:420px !important;
  border-radius:15px !important;
}
</style>
</head>

<body>

<nav>
  <div class="logo">ShopMate</div>

  <div class="search-box">
    <input type="text" id="search" placeholder="Search products...">
    <button onclick="voiceSearch()">🎤</button>
  </div>

  <div class="cart">🛒 <span id="cart-count">0</span></div>

  <div class="toggle-container">
    <div class="toggle-btn" onclick="toggleMode()"></div>
  </div>
</nav>

<section class="hero">
  <div>
    <h1>Shop Smarter</h1>
    <p>AI powered shopping assistant</p>
  </div>
</section>

<section class="section">
  <div style="text-align:center;">
    <button class="filter-btn" onclick="filterProducts('all')">All</button>
    <button class="filter-btn" onclick="filterProducts('shoes')">Shoes</button>
    <button class="filter-btn" onclick="filterProducts('shirts')">Shirts</button>
    <button class="filter-btn" onclick="filterProducts('phones')">Phones</button>
    <button class="filter-btn" onclick="filterProducts('laptops')">Laptops</button>
  </div>
</section>

<section class="section">
  <h2>Products</h2>

  <div class="cards">

    <div class="card" data-category="shoes">
      <img src="https://images.pexels.com/photos/2529148/pexels-photo-2529148.jpeg">
      <h3>Nike Shoes</h3>
      <p>₹2,999</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card" data-category="shirts">
      <img src="https://images.pexels.com/photos/428340/pexels-photo-428340.jpeg">
      <h3>Casual Shirt</h3>
      <p>₹999</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card" data-category="phones">
      <img src="https://images.pexels.com/photos/607812/pexels-photo-607812.jpeg">
      <h3>Smartphone</h3>
      <p>₹15,999</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card" data-category="laptops">
      <img src="https://images.pexels.com/photos/18105/pexels-photo.jpg">
      <h3>Laptop</h3>
      <p>₹45,999</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

  </div>
</section>

<footer>
  <p>✨ Made by Prateek Singh ✨</p>
</footer>

<script>
let count=0;

/* DARK MODE */
function toggleMode(){
  document.body.classList.toggle("light-mode");
}

/* CART */
function addToCart(){
  count++;
  document.getElementById("cart-count").innerText=count;
  showToast("Added to cart 🛒");
}

/* TOAST */
function showToast(msg){
  let toast=document.createElement("div");
  toast.className="toast";
  toast.innerText=msg;
  document.body.appendChild(toast);

  setTimeout(()=>toast.remove(),2000);
}

/* FILTER */
function filterProducts(category){
  let cards=document.querySelectorAll(".card");
  cards.forEach(card=>{
    card.style.display = (category==="all" || card.dataset.category===category) ? "block":"none";
  });
}

/* SEARCH */
document.getElementById("search").addEventListener("keyup", function(){
  let value=this.value.toLowerCase();
  let cards=document.querySelectorAll(".card");

  cards.forEach(card=>{
    card.style.display = card.innerText.toLowerCase().includes(value) ? "block":"none";
  });
});

/* VOICE SEARCH */
function voiceSearch(){
  let recognition=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
  recognition.onresult=function(event){
    document.getElementById("search").value=event.results[0][0].transcript;
  }
  recognition.start();
}
</script>

<!-- WATSON CHAT -->
<script>
window.watsonAssistantChatOptions = {
  integrationID: "4d4af689-f086-4552-a48e-5fc360b893c0",
  region: "eu-de",
  serviceInstanceID: "25aa5c73-cbb5-42b3-8a2d-585abcb66967",
  onLoad: async (instance) => { await instance.render(); }
};
setTimeout(function(){
  const t=document.createElement('script');
  t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + 
  (window.watsonAssistantChatOptions.clientVersion || 'latest') + 
  "/WatsonAssistantChatEntry.js";
  document.head.appendChild(t);
});
</script>

</body>
</html>
