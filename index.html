<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopMate</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
  scroll-behavior:smooth;
}

body{
  background:#0f0f0f;
  color:white;
  transition:0.4s;
}

.light-mode{
  background:#f5f5f5;
  color:#111;
}

/* NAVBAR */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 60px;
  backdrop-filter:blur(20px);
  background:rgba(0,0,0,0.5);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:26px;
  font-weight:600;
  background:linear-gradient(45deg,#ff7eb3,#7afcff);
  -webkit-background-clip:text;
  color:transparent;
}

/* SEARCH */
.search-box{
  display:flex;
  gap:10px;
}

.search-box input{
  padding:10px 15px;
  border-radius:20px;
  border:none;
  outline:none;
}

.search-box button{
  border:none;
  padding:10px 15px;
  border-radius:20px;
  cursor:pointer;
}

/* CART */
.cart{
  font-size:18px;
}

/* TOGGLE */
.toggle-container{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.toggle-btn{
  width:60px;
  height:30px;
  background:#333;
  border-radius:50px;
  position:relative;
  cursor:pointer;
}

.toggle-btn::before{
  content:"";
  position:absolute;
  width:26px;
  height:26px;
  background:white;
  border-radius:50%;
  top:2px;
  left:2px;
  transition:0.3s;
}

.light-mode .toggle-btn::before{
  transform:translateX(30px);
}

.toggle-label{
  font-size:12px;
  margin-top:5px;
}

/* HERO */
.hero{
  height:80vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:url('https://images.pexels.com/photos/994523/pexels-photo-994523.jpeg') center/cover;
}

.hero h1{
  font-size:60px;
}

/* SECTION */
.section{
  padding:60px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:30px;
}

/* CARD */
.card{
  border-radius:20px;
  overflow:hidden;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  transition:0.4s;
}

.card:hover{
  transform:translateY(-10px) scale(1.03);
}

.card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.card h3{
  padding:10px;
}

.card button{
  margin:10px;
  padding:8px 15px;
  border:none;
  border-radius:20px;
  cursor:pointer;
}

/* FOOTER */
footer{
  text-align:center;
  padding:40px;
}

.creator{
  font-weight:bold;
  background:linear-gradient(45deg,#ff7eb3,#7afcff);
  -webkit-background-clip:text;
  color:transparent;
}

</style>
</head>

<body>

<nav>
  <div class="logo">ShopMate</div>

  <div class="search-box">
    <input type="text" id="search" placeholder="Search products...">
    <button onclick="voiceSearch()">🎤</button>
  </div>

  <div class="cart">🛒 <span id="cart-count">0</span></div>

  <div class="toggle-container">
    <div class="toggle-btn" onclick="toggleMode()"></div>
    <div class="toggle-label">Dark Mode</div>
  </div>
</nav>

<section class="hero">
  <div>
    <h1>Shop Smarter</h1>
    <p>AI powered shopping assistant</p>
  </div>
</section>

<section class="section">
  <h2>Products</h2>

  <div class="cards" id="product-list">

    <div class="card">
      <img src="https://images.pexels.com/photos/2529148/pexels-photo-2529148.jpeg">
      <h3>Sneakers</h3>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://images.pexels.com/photos/356056/pexels-photo-356056.jpeg">
      <h3>Headphones</h3>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://images.pexels.com/photos/298863/pexels-photo-298863.jpeg">
      <h3>Smart Watch</h3>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://images.pexels.com/photos/934070/pexels-photo-934070.jpeg">
      <h3>Streetwear</h3>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

  </div>
</section>

<footer>
  <p class="creator">✨ Made by Prateek Singh ✨</p>
</footer>

<script>

/* DARK MODE */
function toggleMode(){
  document.body.classList.toggle("light-mode");
}

/* CART */
let count=0;
function addToCart(){
  count++;
  document.getElementById("cart-count").innerText=count;
}

/* SEARCH */
document.getElementById("search").addEventListener("keyup", function(){
  let value=this.value.toLowerCase();
  let cards=document.querySelectorAll(".card");

  cards.forEach(card=>{
    let text=card.innerText.toLowerCase();
    card.style.display=text.includes(value) ? "block" : "none";
  });
});

/* VOICE SEARCH */
function voiceSearch(){
  let recognition=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
  recognition.onresult=function(event){
    document.getElementById("search").value=event.results[0][0].transcript;
  }
  recognition.start();
}

</script>

<!-- WATSON -->
<script>
  window.watsonAssistantChatOptions = {
    integrationID: "4d4af689-f086-4552-a48e-5fc360b893c0",
    region: "eu-de",
    serviceInstanceID: "25aa5c73-cbb5-42b3-8a2d-585abcb66967",
    onLoad: async (instance) => { await instance.render(); }
  };
  setTimeout(function(){
    const t=document.createElement('script');
    t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + 
    (window.watsonAssistantChatOptions.clientVersion || 'latest') + 
    "/WatsonAssistantChatEntry.js";
    document.head.appendChild(t);
  });
</script>

</body>
</html>
